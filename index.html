<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyglass — Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Animated background layers -->
  <div class="bg-scene" id="bgScene">
    <div class="bg-layer bg-base"></div>
    <div class="bg-layer bg-mid"></div>
    <div class="bg-layer bg-top"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="7" fill="currentColor" opacity="0.9"/>
          <path d="M16 2v4M16 26v4M2 16h4M26 16h4M6.34 6.34l2.83 2.83M22.83 22.83l2.83 2.83M6.34 25.66l2.83-2.83M22.83 9.17l2.83-2.83" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Skyglass</span>
      </div>
      <div class="header-actions">
  <button class="geo-btn" id="geoBtn" title="Use my location">
    &#128205;
  </button>
  <button class="fav-btn" id="favBtn" title="Add to favorites">
    &#129293;
  </button>
  <button class="unit-toggle" id="unitToggle" title="Toggle C / F">
    <span id="unitLabel">&deg;C</span>
  </button>
  <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</div>
    </header>

    <!-- Search -->
    <section class="search-section">
      <div class="search-wrapper">
        <div class="search-bar" id="searchBar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search city…"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-btn" id="searchBtn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </section>

    <!-- Error message -->
    <div class="error-banner" id="errorBanner" role="alert" aria-live="polite"></div>

    <!-- Loading state -->
    <div class="loading-state" id="loadingState">
      <div class="loader-ring"></div>
      <p>Reading the sky…</p>
    </div>

    <!-- Main weather content -->
    <main class="weather-content" id="weatherContent" hidden>

      <!-- Current weather hero -->
      <section class="current-weather">
        <div class="current-left">
          <div class="location-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pin-icon">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <h1 class="city-name" id="cityName">—</h1>
            <span class="country-code" id="countryCode"></span>
          </div>
          <p class="weather-date" id="weatherDate"></p>
          <div class="temp-display">
            <span class="temp-value" id="tempValue">—</span>
            <span class="temp-unit">°</span>
          </div>
          <p class="feels-like" id="feelsLike"></p>
          <div class="condition-row">
            <span class="condition-text" id="conditionText">—</span>
          </div>
        </div>
        <div class="current-right">
          <div class="weather-icon-wrap" id="weatherIconWrap">
            <img class="weather-icon-main" id="weatherIconMain" src="" alt="weather icon" />
          </div>
        </div>
      </section>

      <!-- Stats grid -->
      <section class="stats-grid">
        <div class="stat-card" id="statHumidity">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Humidity</span>
            <span class="stat-value" id="humidityVal">—</span>
          </div>
          <div class="stat-bar"><div class="stat-bar-fill" id="humidityBar"></div></div>
        </div>

        <div class="stat-card" id="statWind">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Wind</span>
            <span class="stat-value" id="windVal">—</span>
          </div>
          <div class="wind-dir" id="windDir">
            <svg class="compass" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.3"/><polygon id="windArrow" points="20,6 24,26 20,22 16,26" fill="currentColor"/></svg>
          </div>
        </div>

        <div class="stat-card" id="statVisibility">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Visibility</span>
            <span class="stat-value" id="visibilityVal">—</span>
          </div>
        </div>

        <div class="stat-card" id="statPressure">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Pressure</span>
            <span class="stat-value" id="pressureVal">—</span>
          </div>
        </div>

        <div class="stat-card sunrise-card" id="statSun">
          <div class="sun-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/>
            </svg>
            <div class="stat-content">
              <span class="stat-label">Sunrise</span>
              <span class="stat-value" id="sunriseVal">—</span>
            </div>
          </div>
          <div class="sun-arc-wrap">
            <svg class="sun-arc" viewBox="0 0 100 55">
              <path d="M5 50 Q50 5 95 50" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.35"/>
              <circle class="sun-dot" id="sunDot" cx="50" cy="27" r="5" fill="currentColor" opacity="0.8"/>
            </svg>
          </div>
          <div class="sun-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="16 6 12 2 8 6"/>
            </svg>
            <div class="stat-content">
              <span class="stat-label">Sunset</span>
              <span class="stat-value" id="sunsetVal">—</span>
            </div>
          </div>
        </div>

        <div class="stat-card" id="statUV">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Cloudiness</span>
            <span class="stat-value" id="cloudVal">—</span>
          </div>
          <div class="stat-bar"><div class="stat-bar-fill" id="cloudBar"></div></div>
        </div>
      </section>

      <!-- 5-day forecast -->
      <section class="forecast-section">
        <h2 class="section-title">5-Day Forecast</h2>
        <div class="forecast-strip" id="forecastStrip">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Hourly strip -->
      <section class="hourly-section">
        <h2 class="section-title">Today's Hours</h2>
        <div class="hourly-strip" id="hourlyStrip">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Alerts -->
      <section class="alerts-container" id="alertsContainer"></section>

      <!-- History -->
      <section class="history-container" id="historyContainer"></section>

      <!-- Favorites -->
      <section class="favorites-container" id="favoritesContainer"></section>

      <!-- Air Quality -->
      <section class="aqi-container" id="aqiContainer"></section>

      <!-- Weather Map -->
      <section class="map-container" id="mapContainer"></section>

    </main>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-globe">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
          <ellipse cx="60" cy="60" rx="25" ry="50" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
          <line x1="10" y1="60" x2="110" y2="60" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
          <line x1="17" y1="35" x2="103" y2="35" stroke="currentColor" stroke-width="1" opacity="0.15"/>
          <line x1="17" y1="85" x2="103" y2="85" stroke="currentColor" stroke-width="1" opacity="0.15"/>
          <circle cx="60" cy="60" r="6" fill="currentColor" opacity="0.5"/>
          <line x1="60" y1="10" x2="60" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
        </svg>
      </div>
      <p class="empty-headline">Where in the world?</p>
      <p class="empty-sub">Search any city to see live conditions and a 5-day forecast.</p>
    </div>

    <footer class="app-footer">
      Powered by <a href="https://openweathermap.org" target="_blank" rel="noopener">OpenWeatherMap</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
